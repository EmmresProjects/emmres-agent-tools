<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
    --ink: #12171f;
    --ink-soft: #48505e;
    --line: #dde2e9;
    --surface: #ffffff;
    --surface-alt: #f5f7fa;
    --accent: #1f5c9e;
    --ok: #1c7a45;
    --warn: #a86400;
    --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--surface-alt); color: var(--ink);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; background: var(--surface);
         border: 1px solid var(--line); border-radius: 10px; padding: 36px 40px 48px; }
  header { border-bottom: 3px solid var(--accent); padding-bottom: 18px; margin-bottom: 26px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 14px; }
  h2 { font-size: 19px; margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 15px; margin: 22px 0 6px; color: var(--accent); }
  p { margin: 8px 0; }
  ul { margin: 8px 0 8px 20px; padding: 0; }
  li { margin: 3px 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 18px; font-size: 13.5px; }
  td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; }
  tr:first-child td { background: var(--surface-alt); font-weight: 600; }
  code, pre { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  code { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  pre { background: #0f1720; color: #e6edf3; padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 14px 0; }
  .verdict { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 999px;
             background: #eaf3ec; color: var(--ok); font-weight: 600; font-size: 13px; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line);
           color: var(--ink-soft); font-size: 12.5px; }
  @media print {
    body { background: #fff; padding: 0; }
    main { border: none; max-width: none; }
    pre { background: #f2f4f7; color: #12171f; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="verdict">{{SUMMARY}}</div>
  </header>
  {{CONTACT_SHEET}}
  {{BODY}}
  <footer>
    Generated by {{TOOL}}. Scores and findings are deterministic rule results; measurement limits are listed
    in the report body and in knowledge-readme.md.
  </footer>
</main>
</body>
</html>
